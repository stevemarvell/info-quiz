[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build"
watchPaths = ["backend/**"]

[deploy]
numReplicas = 1
startCommand = "npm start"
serverless = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/health"
timeout = 100

[deploy.resources]
cpu = 0.5
memory = 512
