[build]
builder = "RAILPACK"
buildCommand = "cd .. && npm ci && npm run build:shared && npm run build:backend"
watchPaths = ["backend/**", "shared/**"]

[deploy]
numReplicas = 1
startCommand = "npm start"
serverless = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.healthcheck]
path = "/health"
timeout = 100

[deploy.resources]
cpu = 0.5
memory = 512
